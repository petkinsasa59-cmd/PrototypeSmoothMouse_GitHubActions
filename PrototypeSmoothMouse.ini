[General]
; Master switch.
Enabled = 1

[Mouse]
; First test: KEEP THIS AT 0. We need the log before choosing the final algorithm.
; Experimental range: 0.10 - 0.95. Higher = smoother but more input latency.
Smoothing = 0.0

; 1.0 keeps the same DirectInput movement strength.
SensitivityMultiplier = 1.0

; 0 = disabled. Optional hard clamp for abnormally large single-poll spikes.
SpikeClamp = 0

[Debug]
; Writes one INPUT statistics line per second to PrototypeSmoothMouse.log.
LogInput = 1
