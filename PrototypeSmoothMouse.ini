[General]
; Master switch.
Enabled = 1

[Mouse]
; Low-latency mouse smoothing.
Smoothing = 0.25
SensitivityMultiplier = 1.0
SpikeClamp = 0

; Smoothing is based on real elapsed time, not the number of game polls.
TimeBasedSmoothing = 1
SmoothingReferenceMs = 4.0

; Prevents a large mouse catch-up delta after a long game/frame stall.
StallProtection = 1
StallThresholdMs = 12.0
StallAlphaScale = 0.50

[Visual]
; Continuous camera-turn motion blur.
MotionBlur = 1
MotionBlurStrength = 0.20
MotionBlurHoldMs = 75.0
MotionBlurTrailScale = 1.05
MotionBlurSamples = 6

; Smooths the blur direction/strength between sparse real mouse deltas.
MotionBlurResponseMs = 18.0
MotionBlurReleaseMs = 55.0

; Small previous-frame persistence to soften rare 12-20 ms frame hitches.
TemporalBlend = 0.07
TemporalStallBoost = 0.12
MotionBlurStallBoost = 0.10

[Debug]
; Writes input/frame diagnostics to PrototypeSmoothMouse.log.
LogInput = 1
