[General]
; Master switch.
Enabled = 1

[Mouse]
; Low-latency mouse smoothing.
Smoothing = 0.25
SensitivityMultiplier = 1.0
SpikeClamp = 0

; Smoothing is based on real elapsed time, not the number of game polls.
TimeBasedSmoothing = 1
SmoothingReferenceMs = 4.0

; Prevents a large mouse catch-up delta after a long game/frame stall.
StallProtection = 1
StallThresholdMs = 12.0
StallAlphaScale = 0.50

[Visual]
; Cinematic directional blur only while turning the camera with the mouse.
MotionBlur = 1
MotionBlurStrength = 0.22
MotionBlurHoldMs = 70.0
MotionBlurHistoryMs = 16.0
MotionBlurTrailScale = 1.10
MotionBlurSamples = 6

; Brief extra blur on an unusually long frame.
MotionBlurStallBoost = 0.12

[Debug]
; Writes input/frame diagnostics to PrototypeSmoothMouse.log.
LogInput = 1
