[General]
Enabled = 1

[Mouse]
Smoothing = 0.25
SensitivityMultiplier = 1.0
SpikeClamp = 0

; Real-time smoothing: independent from game polling rate.
TimeBasedSmoothing = 1
SmoothingReferenceMs = 4.0

; Rare-stall bridge. During a 12+ ms hitch, the accumulated turn is spread
; across a few following polls instead of being dumped into one frame.
StallProtection = 1
StallThresholdMs = 12.0
StallAlphaScale = 0.60

[Visual]
MotionBlur = 1
MotionBlurStrength = 0.22
MotionBlurHoldMs = 70.0
MotionBlurHistoryMs = 8.0
MotionBlurTrailScale = 1.10
MotionBlurSamples = 6
MotionBlurStallBoost = 0.12
MotionBlurResponseMs = 18.0

[Debug]
LogInput = 1
