[General]
; Master switch.
Enabled = 1

[Mouse]
; Low-latency smoothing tuned from the current Prototype 1 tests.
Smoothing = 0.25
SensitivityMultiplier = 1.0
SpikeClamp = 0

; Makes smoothing depend on real elapsed time instead of the game's poll rate.
TimeBasedSmoothing = 1
SmoothingReferenceMs = 4.0

; Helps prevent a large catch-up delta after a rare long game/frame stall.
StallProtection = 1
StallThresholdMs = 12.0
StallAlphaScale = 0.50

[Visual]
; Directional temporal blur used only while turning the camera with the mouse.
MotionBlur = 1
MotionBlurStrength = 0.16
MotionBlurHoldMs = 70.0
MotionBlurHistoryMs = 12.0
MotionBlurTrailScale = 0.80
MotionBlurSamples = 4

; Extra blur only on a long frame to make rare micro-stutters less obvious.
MotionBlurStallBoost = 0.10

[Debug]
; Writes input and frame timing diagnostics to PrototypeSmoothMouse.log.
LogInput = 1
